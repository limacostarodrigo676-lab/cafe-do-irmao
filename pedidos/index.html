<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const PRODUCTS = [
  {
    id: "classico-250",
    name: "O Clássico do Dia a Dia",
    size: "250 gramas",
    sizeShort: "250g",
    seal: "FORTE",
    desc: "Tamanho certo pra quem não abre mão de café forte todo dia. Rende bem, mantém o sabor e cabe no bolso.",
    tags: ["Torrado escuro", "Moído", "Seleção manual"],
    price: 24.9,
    tone: "a",
  },
  {
    id: "familia-500",
    name: "Para Família e Empresa",
    size: "500 gramas",
    sizeShort: "500g",
    seal: "FAMÍLIA",
    desc: "Para casa que consome muito ou empresa que não abre mão da qualidade. O mesmo café forte — em maior quantidade.",
    tags: ["Torrado escuro", "Moído", "Melhor custo"],
    price: 44.9,
    tone: "b",
  },
];

const STORE_WHATSAPP = "5544999547356"; // (44) 99954-7356

function money(v) {
  return "R$ " + v.toFixed(2).replace(".", ",");
}

function prefersReducedMotion() {
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/* ---------------- Three.js hero: a small procedural 3D coffee bag ---------------- */
function ThreeHero() {
  const mountRef = useRef(null);
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    const THREE = window.THREE;
    const container = mountRef.current;
    if (!THREE || !container) {
      setFailed(true);
      return;
    }

    let width = container.clientWidth || 320;
    let height = container.clientHeight || 260;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, width / height, 0.1, 100);
    camera.position.set(0, 0.25, 4.4);

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    } catch (e) {
      setFailed(true);
      return;
    }
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x4a2c14, 0.65));
    const key = new THREE.PointLight(0xf5a820, 2.4, 22, 2);
    key.position.set(2.2, 2, 3);
    scene.add(key);
    const rim = new THREE.PointLight(0xf0dba5, 1.1, 20, 2);
    rim.position.set(-2.6, 1.2, -2);
    scene.add(rim);
    const fillLight = new THREE.PointLight(0x2f6f63, 0.6, 18, 2);
    fillLight.position.set(0, -1.5, 2);
    scene.add(fillLight);

    const bag = new THREE.Group();

    const bodyGeo = new THREE.BoxGeometry(1.55, 1.95, 0.62, 3, 3, 2);
    const bodyPos = bodyGeo.attributes.position;
    // Soften the hard edges a little by pulling corner-ish verts inward (cheap fake bevel).
    for (let i = 0; i < bodyPos.count; i++) {
      const x = bodyPos.getX(i), y = bodyPos.getY(i), z = bodyPos.getZ(i);
      const edge = Math.abs(x) > 0.6 && Math.abs(z) > 0.2;
      if (edge) {
        bodyPos.setX(i, x * 0.92);
        bodyPos.setZ(i, z * 0.92);
      }
    }
    bodyGeo.computeVertexNormals();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3d2410, roughness: 0.88, metalness: 0.04 });
    bag.add(new THREE.Mesh(bodyGeo, bodyMat));

    const foldGeo = new THREE.BoxGeometry(1.15, 0.34, 0.64);
    const foldMat = new THREE.MeshStandardMaterial({ color: 0x6b4626, roughness: 0.92 });
    const fold = new THREE.Mesh(foldGeo, foldMat);
    fold.position.set(0, 1.06, 0);
    fold.rotation.x = 0.18;
    bag.add(fold);

    const sealGeo = new THREE.CylinderGeometry(0.44, 0.44, 0.06, 40);
    const sealMat = new THREE.MeshStandardMaterial({
      color: 0xf5a820, roughness: 0.35, metalness: 0.25,
      emissive: 0x2b1400, emissiveIntensity: 0.15,
    });
    const seal = new THREE.Mesh(sealGeo, sealMat);
    seal.rotation.x = Math.PI / 2;
    seal.position.set(0, 0.1, 0.34);
    bag.add(seal);

    const ringGeo = new THREE.TorusGeometry(0.44, 0.025, 12, 48);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x1a0e05, roughness: 0.6 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(seal.position);
    bag.add(ring);

    scene.add(bag);

    // A few drifting "steam" motes rising off the bag.
    const moteCount = 26;
    const moteGeo = new THREE.BufferGeometry();
    const motePos = new Float32Array(moteCount * 3);
    const moteSeed = new Float32Array(moteCount);
    for (let i = 0; i < moteCount; i++) {
      motePos[i * 3] = (Math.random() - 0.5) * 1.6;
      motePos[i * 3 + 1] = Math.random() * 2.4 - 1.2;
      motePos[i * 3 + 2] = (Math.random() - 0.5) * 1.2 + 0.4;
      moteSeed[i] = Math.random() * Math.PI * 2;
    }
    moteGeo.setAttribute("position", new THREE.BufferAttribute(motePos, 3));
    const moteMat = new THREE.PointsMaterial({
      color: 0xf0dba5, size: 0.045, transparent: true, opacity: 0.55, depthWrite: false,
    });
    const motes = new THREE.Points(moteGeo, moteMat);
    scene.add(motes);

    const reduced = prefersReducedMotion();
    let raf;
    let t = 0;
    let pointerX = 0;

    function onPointerMove(e) {
      const rect = container.getBoundingClientRect();
      const x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX) || 0) - rect.left;
      pointerX = (x / rect.width) * 2 - 1;
    }
    container.addEventListener("pointermove", onPointerMove);

    function animate() {
      raf = requestAnimationFrame(animate);
      if (!reduced) {
        t += 0.007;
        bag.rotation.y = t * 0.22 + pointerX * 0.35;
        bag.position.y = Math.sin(t * 1.4) * 0.07;

        const pos = moteGeo.attributes.position;
        for (let i = 0; i < moteCount; i++) {
          let y = pos.getY(i) + 0.0022;
          if (y > 1.3) y = -1.2;
          pos.setY(i, y);
          pos.setX(i, pos.getX(i) + Math.sin(t * 2 + moteSeed[i]) * 0.0006);
        }
        pos.needsUpdate = true;
      }
      renderer.render(scene, camera);
    }
    animate();

    function handleResize() {
      width = container.clientWidth;
      height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    window.addEventListener("resize", handleResize);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", handleResize);
      container.removeEventListener("pointermove", onPointerMove);
      if (renderer.domElement.parentNode === container) container.removeChild(renderer.domElement);
      bodyGeo.dispose(); bodyMat.dispose();
      foldGeo.dispose(); foldMat.dispose();
      sealGeo.dispose(); sealMat.dispose();
      ringGeo.dispose(); ringMat.dispose();
      moteGeo.dispose(); moteMat.dispose();
      renderer.dispose();
    };
  }, []);

  return (
    <div className="three-hero" ref={mountRef}>
      {!failed && <span className="hero-hint">ARRASTE PRA GIRAR</span>}
    </div>
  );
}

/* ---------------- small shared bits ---------------- */
function Stepper({ value, onDelta, dark }) {
  return (
    <div className={"stepper" + (dark ? " dark" : "")}>
      <button type="button" onClick={() => onDelta(-1)}>−</button>
      <span>{value}</span>
      <button type="button" onClick={() => onDelta(1)}>+</button>
    </div>
  );
}

function TopBar() {
  return (
    <div className="topbar">
      <div className="topbar-left">
        <a className="back-link" href="/">&larr; SITE</a>
        <div className="logo"><span className="cafe">CAFÉ</span><span className="irmao">IRMÃO</span></div>
      </div>
      <div className="unit-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
        MANDAGUAÇU · PR
      </div>
    </div>
  );
}

function BottomNav({ view, onGoCatalog, onGoCart, cartCount, badgePop }) {
  return (
    <nav className="bottom-nav">
      <button type="button" className={"nav-btn" + (view === "catalog" ? " active" : "")} onClick={onGoCatalog}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
          <path d="M4 8h13a3 3 0 0 1 0 6h-1" /><path d="M4 8v7a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V8" /><path d="M8 3v2M12 3v2M16 3v2" />
        </svg>
        CARDÁPIO
      </button>
      <button type="button" className={"nav-btn" + (view === "cart" ? " active" : "")} onClick={onGoCart}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
          <path d="M6 8h12l-1.2 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 8Z" /><path d="M9 8V6a3 3 0 0 1 6 0v2" />
        </svg>
        CARRINHO
        <span className={"nav-badge" + (cartCount > 0 ? " show" : "") + (badgePop ? " pop" : "")}>{cartCount}</span>
      </button>
    </nav>
  );
}

/* ---------------- screens ---------------- */
function CatalogScreen({ draftQty, onStepDraft, onAdd }) {
  return (
    <main className="view">
      <section className="hero-strip">
        <ThreeHero />
        <div className="hero-copy">
          <span className="eyebrow">PEÇA O SEU</span>
          <h1>CAFÉ FORTE,<br />NA PORTA DE <span>CASA.</span></h1>
          <p>Torrado e moído com cuidado. Escolha o pacote, confirme os dados e a gente combina a entrega pelo WhatsApp.</p>
        </div>
      </section>

      <section className="catalog-section">
        <span className="eyebrow on-parchment">NOSSOS PRODUTOS</span>
        <h2>Escolha o seu.</h2>

        {PRODUCTS.map((p) => (
          <div className="product-card" key={p.id}>
            <div className={"bag-art tone-" + p.tone}>
              <div className="bag">
                <div className="seal">{p.seal}</div>
                <div className="size-tag">{p.sizeShort.toUpperCase()}</div>
              </div>
            </div>
            <div className="product-body">
              <span className="product-size">{p.size.toUpperCase()}</span>
              <h3 className="product-title">{p.name}</h3>
              <p className="product-desc">{p.desc}</p>
              <div className="tag-row">
                {p.tags.map((t) => <span className="tag" key={t}>{t.toUpperCase()}</span>)}
              </div>
              <div className="product-footer">
                <span className="price">{money(p.price)} <small>/ pacote</small></span>
                <Stepper value={draftQty[p.id] || 1} onDelta={(d) => onStepDraft(p.id, d)} />
              </div>
              <button type="button" className="btn btn-gold" onClick={() => onAdd(p.id)}>ADICIONAR AO CARRINHO</button>
            </div>
          </div>
        ))}
      </section>
    </main>
  );
}

function CartScreen({ cart, subtotal, onStepCart, onRemove, onGoCheckout, onGoCatalog }) {
  return (
    <main className="view">
      <div className="cart-wrap">
        <span className="eyebrow">SEU PEDIDO</span>
        <h2>Confere aí.</h2>

        {cart.length === 0 ? (
          <div className="empty-state">
            <p>Seu carrinho tá vazio.<br />Bora escolher um café?</p>
            <button type="button" className="btn btn-outline" onClick={onGoCatalog}>VER CARDÁPIO</button>
          </div>
        ) : (
          <React.Fragment>
            {cart.map((c, i) => {
              const p = PRODUCTS.find((p) => p.id === c.id);
              return (
                <div className="cart-item" key={p.id}>
                  <div className={"cart-swatch" + (p.tone === "b" ? " b" : "")}></div>
                  <div>
                    <div className="name">{p.name}</div>
                    <div className="meta">{p.size}</div>
                    <div className="row-controls">
                      <Stepper value={c.qty} dark onDelta={(d) => onStepCart(i, d)} />
                      <button type="button" className="remove-link" onClick={() => onRemove(i)}>remover</button>
                    </div>
                  </div>
                  <div className="line-price">{money(p.price * c.qty)}</div>
                </div>
              );
            })}
            <div className="subtotal-row">
              <span className="label">SUBTOTAL</span>
              <span className="amount">{money(subtotal)}</span>
            </div>
            <button type="button" className="btn btn-gold btn-block" onClick={onGoCheckout}>IR PARA ENTREGA</button>
          </React.Fragment>
        )}
      </div>
    </main>
  );
}

const PAYMENTS = ["Pix", "Cartão na entrega", "Dinheiro"];

function CheckoutScreen({ form, setForm, errors, onSubmit }) {
  return (
    <main className="view">
      <div className="checkout-wrap">
        <span className="eyebrow">QUASE LÁ</span>
        <h2>Finalizar pedido.</h2>

        <div className="step">
          <div className="step-head"><span className="step-num">01</span><span className="step-title">SEUS DADOS</span></div>
          <label className="field"><span>Nome</span>
            <input type="text" placeholder="Seu nome" value={form.nome} onChange={(e) => setForm({ ...form, nome: e.target.value })} />
          </label>
          <label className="field"><span>WhatsApp</span>
            <input type="tel" placeholder="(44) 90000-0000" value={form.telefone} onChange={(e) => setForm({ ...form, telefone: e.target.value })} />
          </label>
          {errors.dados && <div className="field-error">Preenche nome e WhatsApp pra gente continuar.</div>}
        </div>

        <div className="step">
          <div className="step-head"><span className="step-num">02</span><span className="step-title">RETIRADA OU ENTREGA</span></div>
          <div className="choice-row">
            <div className={"choice" + (!form.entrega ? " selected" : "")} onClick={() => setForm({ ...form, entrega: false })}>RETIRAR NA LOJA</div>
            <div className={"choice" + (form.entrega ? " selected" : "")} onClick={() => setForm({ ...form, entrega: true })}>ENTREGA</div>
          </div>
          {form.entrega && (
            <div className="addr-field">
              <label className="field"><span>Endereço de entrega</span>
                <textarea placeholder="Rua, número, bairro, referência" value={form.endereco} onChange={(e) => setForm({ ...form, endereco: e.target.value })} />
              </label>
            </div>
          )}
          {errors.endereco && <div className="field-error">Adiciona o endereço pra gente entregar certinho.</div>}
        </div>

        <div className="step">
          <div className="step-head"><span className="step-num">03</span><span className="step-title">PAGAMENTO</span></div>
          <div className="choice-row">
            {PAYMENTS.map((p) => (
              <div key={p} className={"choice" + (form.pagamento === p ? " selected" : "")} onClick={() => setForm({ ...form, pagamento: p })}>
                {p.toUpperCase()}
              </div>
            ))}
          </div>
          <p className="payment-note">Por enquanto o pagamento é combinado direto com a loja pelo WhatsApp — a cobrança automática de Pix é o próximo passo do roteiro do app.</p>
        </div>

        <button type="button" className="btn btn-gold btn-block" onClick={onSubmit}>ENVIAR PEDIDO PELO WHATSAPP</button>
      </div>
    </main>
  );
}

function ConfirmScreen({ data, onNewOrder }) {
  if (!data) return null;
  return (
    <main className="view">
      <div className="confirm-hero">
        <div className="check">✓</div>
        <h2>PEDIDO PRONTO<br />PRA ENVIAR.</h2>
        <p>Abrimos o WhatsApp com tudo preenchido — é só conferir e apertar enviar por lá.</p>
      </div>
      <div className="confirm-summary">
        <div className="summary-card">
          {data.lines.map((l, i) => <div className="summary-line" key={i}><span className="k">{l}</span></div>)}
          <div className="summary-line total"><span className="k">SUBTOTAL</span><span className="v">{data.subtotalText}</span></div>
          <div className="summary-line"><span className="k">{data.entrega ? "Entrega" : "Retirada"}</span><span className="v">{data.entrega ? data.endereco : "Loja · Mandaguaçu, PR"}</span></div>
          <div className="summary-line"><span className="k">Pagamento</span><span className="v">{data.pagamento}</span></div>
        </div>
        <a className="btn btn-gold btn-block" href={data.waUrl} target="_blank" rel="noopener">ABRIR WHATSAPP</a>
        <button type="button" className="btn btn-outline btn-block" style={{ marginTop: "0.7rem" }} onClick={onNewOrder}>FAZER NOVO PEDIDO</button>
        <p className="proto-note">Este é um protótipo funcional do app — o pedido é enviado como mensagem pro WhatsApp da loja. Pagamento automático, painel de pedidos e cadastro de novas unidades entram nas próximas fases.</p>
      </div>
    </main>
  );
}

/* ---------------- root ---------------- */
function App() {
  const [view, setView] = useState("catalog");
  const [draftQty, setDraftQty] = useState({});
  const [cart, setCart] = useState([]);
  const [form, setForm] = useState({ nome: "", telefone: "", endereco: "", entrega: false, pagamento: "Pix" });
  const [errors, setErrors] = useState({ dados: false, endereco: false });
  const [confirmData, setConfirmData] = useState(null);
  const [badgePop, setBadgePop] = useState(false);

  const stepDraft = useCallback((id, delta) => {
    setDraftQty((prev) => ({ ...prev, [id]: Math.max(1, (prev[id] || 1) + delta) }));
  }, []);

  const addToCart = useCallback((id) => {
    setCart((prev) => {
      const qty = draftQty[id] || 1;
      const idx = prev.findIndex((c) => c.id === id);
      if (idx >= 0) {
        const next = [...prev];
        next[idx] = { ...next[idx], qty: next[idx].qty + qty };
        return next;
      }
      return [...prev, { id, qty }];
    });
    setDraftQty((prev) => ({ ...prev, [id]: 1 }));
    if (!prefersReducedMotion()) {
      setBadgePop(false);
      requestAnimationFrame(() => setBadgePop(true));
    }
  }, [draftQty]);

  const stepCart = useCallback((index, delta) => {
    setCart((prev) => {
      const next = [...prev];
      next[index] = { ...next[index], qty: next[index].qty + delta };
      return next.filter((c) => c.qty > 0);
    });
  }, []);

  const removeCart = useCallback((index) => {
    setCart((prev) => prev.filter((_, i) => i !== index));
  }, []);

  const cartCount = useMemo(() => cart.reduce((s, c) => s + c.qty, 0), [cart]);
  const subtotal = useMemo(() => cart.reduce((s, c) => {
    const p = PRODUCTS.find((p) => p.id === c.id);
    return s + (p ? p.price * c.qty : 0);
  }, 0), [cart]);

  function submitOrder() {
    const hasDados = form.nome.trim() && form.telefone.trim();
    const hasEndereco = !form.entrega || form.endereco.trim();
    setErrors({ dados: !hasDados, endereco: !hasEndereco });
    if (!hasDados || !hasEndereco) return;
    if (cart.length === 0) { setView("catalog"); return; }

    const lines = cart.map((c) => {
      const p = PRODUCTS.find((p) => p.id === c.id);
      return "• " + c.qty + "x " + p.name + " (" + p.size + ") — " + money(p.price * c.qty);
    });

    const summaryText =
      "Pedido — Café do Irmão\n" +
      "Cliente: " + form.nome + "\n" +
      "WhatsApp: " + form.telefone + "\n\n" +
      lines.join("\n") + "\n\n" +
      "Subtotal: " + money(subtotal) + "\n" +
      (form.entrega ? "Entrega: " + form.endereco + "\n" : "Retirada: loja Mandaguaçu, PR\n") +
      "Pagamento: " + form.pagamento;

    const waUrl = "https://wa.me/" + STORE_WHATSAPP + "?text=" + encodeURIComponent(summaryText);

    setConfirmData({
      lines, subtotalText: money(subtotal), entrega: form.entrega, endereco: form.endereco,
      pagamento: form.pagamento, waUrl,
    });
    setView("confirm");
  }

  function newOrder() {
    setCart([]);
    setForm({ nome: "", telefone: "", endereco: "", entrega: false, pagamento: "Pix" });
    setErrors({ dados: false, endereco: false });
    setConfirmData(null);
    setView("catalog");
  }

  return (
    <div className="app">
      <TopBar />
      {view === "catalog" && <CatalogScreen draftQty={draftQty} onStepDraft={stepDraft} onAdd={addToCart} />}
      {view === "cart" && (
        <CartScreen cart={cart} subtotal={subtotal} onStepCart={stepCart} onRemove={removeCart}
          onGoCheckout={() => setView("checkout")} onGoCatalog={() => setView("catalog")} />
      )}
      {view === "checkout" && <CheckoutScreen form={form} setForm={setForm} errors={errors} onSubmit={submitOrder} />}
      {view === "confirm" && <ConfirmScreen data={confirmData} onNewOrder={newOrder} />}

      {(view === "catalog" || view === "cart") && (
        <BottomNav view={view} cartCount={cartCount} badgePop={badgePop}
          onGoCatalog={() => setView("catalog")} onGoCart={() => setView("cart")} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
